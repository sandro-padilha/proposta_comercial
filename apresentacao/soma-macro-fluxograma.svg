<text x="1239" y="343" class="ink b" font-size="25" letter-spacing="0.4">CONDIÇÃO</text>
<text x="1193" y="397" class="mut" font-size="18">O que a inspeção encontrou?</text>
<line x1="1193" y1="420" x2="1472" y2="420" stroke="#E1E9EC" stroke-width="1.5"/>
<text x="1193" y="448" class="cop eyebrow" font-size="13">RESULTADO</text>
<text x="1193" y="483" class="acc sb" font-size="21">IEA</text>

<text x="838" y="448" class="cop eyebrow" font-size="13">RESULTADO</text>
<text x="838" y="483" class="acc sb" font-size="21">IPD</text>
<text x="838" y="505" class="mut" font-size="15">ranking de inspeção</text>

<path d="M1147 398 L1161 405 L1147 412 Z" fill="#9FB4BB"/>


<text x="483" y="397" class="mut" font-size="18">Com que frequência falha?</text>
<line x1="483" y1="420" x2="762" y2="420" stroke="#E1E9EC" stroke-width="1.5"/>
<text x="483" y="448" class="cop eyebrow" font-size="13">RESULTADO</text>

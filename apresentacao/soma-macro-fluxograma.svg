<text x="262" y="208" class="ink" font-size="19">Compensações
  <tspan class="mut">  ·  </tspan>Clientes<tspan class="mut">  ·  </tspan>Consumo<tspan class="mut">  ·  </tspan>Ocorrências<tspan class="mut">  ·  </tspan>Inspeções em campo</text>

<path d="M800 232 L800 254" stroke="#9FB4BB" stroke-width="2.5"/>

<!-- ================= IER ================= -->
<rect x="100" y="578" width="1400" height="102" rx="10" fill="#1B5068"/>
<text x="148" y="645" class="wht b" font-size="34">IER  =  40% IPD  +  60% IEA</text>
<text x="1452" y="631" class="wht sb" font-size="21" text-anchor="end" opacity="0.95">Prioridade única de atuação</text>
<text x="1452" y="657" class="wht" font-size="16" text-anchor="end" opacity="0.72">do ativo mais crítico ao menos crítico</text>

<path d="M800 680 L800 714" stroke="#9FB4BB" stroke-width="2.5"/>
<path d="M793 712 L800 726 L807 712 Z" fill="#9FB4BB"/>


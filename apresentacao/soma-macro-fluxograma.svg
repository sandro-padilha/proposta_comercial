<rect width="1600" height="900" fill="#FFFFFF"/>

<!-- ================= TITULO ================= -->
<rect x="100" y="56" width="6" height="56" fill="#9A5A24"/>
<text x="126" y="90" class="ink b" font-size="40" letter-spacing="0.5">METODOLOGIA SOMA</text>
<text x="126" y="122" class="mut" font-size="20">Como a prioridade de manutenção é definida — do dado operacional à decisão de investimento</text>
<rect x="1276" y="62" width="224" height="38" rx="19" fill="#E6EFF3"/>
<text x="1388" y="87" class="acc b" font-size="15" letter-spacing="1.2" text-anchor="middle">CICLO ANUAL · FEV–JUL</text>

<!-- ================= ENTRADAS ================= -->
<rect x="100" y="168" width="1400" height="64" rx="8" fill="#F3F7F8" stroke="#C9D6DB"/>

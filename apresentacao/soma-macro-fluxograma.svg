<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Calibri, Arial, Helvetica, sans-serif">
<defs>
  <style>
    .ink{fill:#10212B}.mut{fill:#5B7078}.acc{fill:#1B5068}.cop{fill:#9A5A24}.wht{fill:#FFFFFF}
    .b{font-weight:700}.sb{font-weight:600}
    .eyebrow{font-size:14px;font-weight:700;letter-spacing:1.6px}
  </style>
